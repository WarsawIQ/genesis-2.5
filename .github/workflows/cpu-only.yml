# Reproduce the claims that need no GPU on every push, on a clean machine:
# the Hines-solver fixes, linear model construction and the Vogels-Abbott
# network on one core (reproduce/run_all.sh --cpu-only --quick, about 2
# minutes of simulation). The verdict table is printed at the end of the log
# and the results are kept as an artifact. Before that, the claim map must
# regenerate with no change (no number edited by hand) and its tests must pass.
name: cpu-only reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libncurses-dev python3 texlive-latex-base
      - name: Claim map is current and refuses broken input
        run: |
          python3 reproduce/make_numbers.py --check
          sh reproduce/check_paths.sh
          sh reproduce/tests/test_claims.sh
          sh reproduce/tests/test_campaign.sh
      - name: Reproduce the CPU claims
        run: sh reproduce/run_all.sh --cpu-only --quick
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-only-results
          path: reproduce/results/

  # The same claims from the container (reviewer point 11: reproducible with
  # nothing installed), so the Dockerfile is tested continuously too.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t genesis25-cpu .
      - name: Reproduce the CPU claims in the container
        run: docker run --rm genesis25-cpu
